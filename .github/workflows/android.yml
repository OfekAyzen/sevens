name: android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate runs first and the APK job depends on it, so a red build can never
  # produce an installable artifact.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:cov
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  apk:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - name: Build web bundle and sync to Android
        run: npm run cap:sync

      # Debug build: what the four of you sideload. Signed with the standard
      # debug key, which is fine for sharing an APK directly but means Play
      # Store distribution would need a real keystore.
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the artifact after the build
        id: name
        run: |
          SHORT="$(git rev-parse --short HEAD)"
          VERSION="${GITHUB_REF_NAME//\//-}"
          echo "apk=sevens-${VERSION}-${SHORT}.apk" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/debug/app-debug.apk "sevens-${VERSION}-${SHORT}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.apk }}
          path: ${{ steps.name.outputs.apk }}
          retention-days: 30

      # A tag additionally publishes a release, so the install link is a plain
      # URL you can paste into a group chat.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.name.outputs.apk }}
          generate_release_notes: true
